<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La meva col·lecció de videojocs</title>
    <meta name="description" content="La meva col·lecció de videojocs" />
    <link rel="icon" href="../../assets/logo.ico"/>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <header>
        <h1>La meva col·lecció de videojocs</h1>
    </header>
        <nav>
            <ul>
                <li><a href="#Imatges">Imatges</a></li>
                <li><a href="#Videos">Videos</a></li>
                <li><a href="#Musica">Música</a></li>
            </ul>
        </nav>
    <main>
        <section id="Imatges">
            <h2>Imatges</h2>
            <p>Aquí tens les portades dels meus videojocs preferits:</p>
                <figure>
                    <img
                    src="/assets/cyberpunk_2077.jpg"
                    alt="Portada Cyberpunk 2077"
                    width="400"
                    />
                    <figcaption>Cyberpunk 2077, un videojoc de rol de l'any 2020</figcaption>
                </figure>
                <figure>
                    <img
                    src="/assets/tboi_repentance.jpg"
                    alt="Portada The Binding of Isaac: Rebirth|Repentance"
                    width="400"
                    />
                    <figcaption>The Binding of Isaac: Rebirth(Repentance), un videojoc roguelike de l'any 2014</figcaption>
                </figure>
        </section>
        <section id="Videos">
            <h2>Videos</h2>
            <p>Aquí tens trailers i gameplays dels meus videojocs preferits:</p>
                <video controls poster="./img/poster-minecraft-video.png" width="600" height="350">
                    Minecraft Videojoc
                    <source src="./video/minecraft-trailer.mp4" type="video/mp4" />
                    <source src="./video/minecraft-trailer.ogv" type="video/ogg" />
                </video>
        </section>
    </main>
</body>
</html>
